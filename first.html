<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>my first JQUERY program</title>
</head>

<body>
    <h2 id="demo">Welcom to JQuery </h2>
    <button id="btn">Click Me</button>

    <p>If you click on me, I will disappear.</p>
    <p>Click me away!</p>
    <p>Click me too!</p>

    <!-- ID Selector -->
    <p id="message">Hello World</p>


    <!-- Class Selector -->
    <p class="info">First paragraph</p>
    <p class="info">Second paragraph</p>

    <!-- Element Selector -->
    <p>First</p>
    <p>Second</p>

    <!-- Universal Selector -->
    <!-- (*) -->


    <!-- Group Selector -->
    <!-- h1, p, button -->


    <!-- Attribute Selector -->
    <input type="text" placeholder="Enter name">



    <!-- ========================================= -->

    <!-- click event -->
    <button id="btn2">click me</button>

    <!-- double click event -->
    <p id="para2">Double-click this para</p>

    <!-- mouse enter event -->
    <h2 id="heading2">move your mouse here</h2>


    <!-- mouse leave event -->
    <h3 id="heading3">move your mouse here</h3>


    <!-- hover event -->
    <p id="hoverText">move the mouse over me</p>


    <!-- keypress event -->
    <input type="text" id="name" placeholder="type somthing">

    <!-- keydown event -->
    <input type="text" id="text" placeholder="Enter your username">







    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/4.0.0/jquery.min.js"></script>

    <script>
        $(function () {
            $("#btn").click(function () {
                $("#demo").text("Hello Duniya!!");
            })
        });

        // $(document).ready(function () {
        //     $("p").click(function () {
        //         $(this).hide();
        //     });
        // });



        // ````````ID Selector`````````````````
        $("#message").css("color", "red");



        // ```````Class Selector```````````````

        $(".info").css("color", "blue");


        // ```````Element Selector````````````
        // $("p").css("font-size", "20px");


        // ```````Universal Selector````````````
        $("*").css("font-family", "Arial");


        // ```````Group Selector````````````````````````
        // $("h1, p, button").css("color", "green");


        // ```````Attribute Selector````````````````````````
        $("input[type='text']").css("background-color", "lightyellow");





        // ===========================   EVENTs    ====================================================

        // ```````click events````````````````````````
        $("#btn2").click(function () {
            alert("button clicked!");
        });

        // ```````double-click events````````````````````````
        $("#para2").dblclick(function () {
            $(this).css("color", "red");
        });


        // ```````mouse enter events````````````````````````
        $("#heading2").mouseenter(function () {
            $(this).css("background-color", "yellow");
        });


        // ```````mouse leave events````````````````````````
        $("#heading3").mouseleave(function () {
            $(this).css("background-color", "black");
        });


        // ``````` hover events````````````````````````
        $("#hoverText").hover(function () {
            $(this).css("color", "red");
        },
            function () {
                $(this).css("color", "black");
            });



        // ``````` keypress events````````````````````````

        $("#name").keypress(function () {
            alert(" pressed!.")
        })



        // ``````` keydown events````````````````````````
        $("#text").keydown(function () {
            alert("A key was pressed!.")
        })




    </script>

</body>

</html>
