<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>my first JQUERY program</title>
</head>

<body>
    <h2 id="demo">Welcom to JQuery </h2>
    <button id="btn">Click Me</button>

    <p>If you click on me, I will disappear.</p>
    <p>Click me away!</p>
    <p>Click me too!</p>

<!-- ID Selector -->
    <p id="message">Hello World</p>


<!-- Class Selector -->
    <p class="info">First paragraph</p>
    <p class="info">Second paragraph</p>

<!-- Element Selector -->
    <p>First</p>
    <p>Second</p>

<!-- Universal Selector -->
    <!-- (*) -->


<!-- Group Selector -->
    <!-- h1, p, button -->


<!-- Attribute Selector -->
 <input type="text" placeholder="Enter name">





























    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/4.0.0/jquery.min.js"></script>

    <script>
        $(function () {
            $("#btn").click(function () {
                $("#demo").text("Hello Duniya!!");
            })
        });

        $(document).ready(function () {
            $("p").click(function () {
                $(this).hide();
            });
        });



// ````````ID Selector`````````````````
        $("#message").css("color", "red");



// ```````Class Selector```````````````

        $(".info").css("color", "blue");


// ```````Element Selector````````````
        $("p").css("font-size", "20px");


// ```````Universal Selector````````````
        $("*").css("font-family", "Arial");


// ```````Group Selector````````````````````````
        $("h1, p, button").css("color", "green");


// ```````Attribute Selector````````````````````````
        $("input[type='text']").css("background-color", "lightyellow");




    </script>

</body>

</html>
